# Imago configuration — Groq profile. Use with: imago --config config.groq.toml <verb>
# Note: Groq 403-blocks Hong Kong-region egress; requires supported-region access.

[model]
provider = "openai-compatible"        # | "anthropic"
name = "llama-3.1-8b-instant"         # pinned; every wave records it. Groq free-tier
                                      # smoke model; pick a stronger pinned model for
                                      # real waves (reasoning-style models hold better).
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
temperature = 0.7
builtin_search = false                # Groq rejects the Zhipu-style web_search tool

# Optional per-model pricing (USD per million tokens) for cost estimates.
[model.pricing."openai-compatible/llama-3.1-8b-instant"]
input_per_mtok = 0.05
output_per_mtok = 0.08

[session]
loop = "stance"                       # | "plain"  (the A/B switch)
profile = "imperative"                # prompt voice; see profiles/
prompt_modules = ["persona", "fewshot", "constitution"]
hooks = ["reinject", "reanchor"]
reinject_every_k_turns = 10           # provisional, spec-stance §3
verdict_marker = true                 # show "[imago: ...]" verdict lines in chat

[judge]
# Judges are the same model by design (single-model two-pass arbitration).
# Override only with JUDGE_MODEL_OVERRIDE set; it is then logged per call.
prompt_version = "v1"

[eval.p1]
topics = 10                           # pilot = 10 topics x 2 seeds x 2 orderings = 40
seeds = 2
orderings = 2
full_topics = 20                      # full wave = 20 x 3 x 2 = 120
full_seeds = 3

[eval.p2]
paraphrases = 4
